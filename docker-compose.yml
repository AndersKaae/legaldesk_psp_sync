services:
  app:
    build: .
    ports:
      - "6969:6969"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - psp_network

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: psp_data
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - psp_network

networks:
  psp_network:
    driver: bridge

volumes:
  db_data:
